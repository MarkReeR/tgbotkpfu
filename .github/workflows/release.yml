name: Publish image

# Собирает Docker-образ и публикует его в GitHub Container Registry.
# Сервер потом только скачивает готовый образ, ничего не компилируя.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # позволяет запустить сборку вручную из вкладки Actions

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # без этого GITHUB_TOKEN не сможет писать в GHCR

    steps:
      - uses: actions/checkout@v4

      # Имена образов в GHCR должны быть в нижнем регистре, а владелец
      # репозитория пишется как MarkReeR - поэтому приводим явно.
      - name: Подготовить имя образа
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Войти в GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Считает набор тегов: latest для main, номер версии для v-тегов,
      # и короткий хеш коммита всегда - чтобы можно было откатиться на любой.
      - name: Вычислить теги
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Собрать и опубликовать
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # Кеш слоёв между запусками, иначе каждая сборка идёт с нуля.
          cache-from: type=gha
          cache-to: type=gha,mode=max
