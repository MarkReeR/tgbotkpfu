services:
  bot:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: tgbotkpfu:latest
    container_name: tgbotkpfu
    restart: unless-stopped

    environment:
      # Required. Put the real token in a .env file next to this one:
      #   BOT_TOKEN=123456:AA...
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}

      SPREADSHEET_ID: ${SPREADSHEET_ID:-1aXfcSn63NthC8wxfawc6zYGVlLDuz82WaTe4EHYQpfw}
      SHEETS: ${SHEETS:-1 курс:0,2 курс:1091191709,3 курс:92806381,4 курс:581856196,5 курс:1325846251,6 курс:782502099}
      REFRESH_MINUTES: ${REFRESH_MINUTES:-15}

      PHYSED_SPREADSHEET_ID: ${PHYSED_SPREADSHEET_ID:-}
      PHYSED_GID: ${PHYSED_GID:-0}
      PHYSED_VENUE: ${PHYSED_VENUE:-Спорткомплекс (ВУЗ)}

      # Flip to true for the exam session, then `docker compose up -d` to apply.
      EXAMS_SHOW: ${EXAMS_SHOW:-false}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-Europe/Moscow}

    # The database and logs live here, so the chosen groups survive a redeploy.
    volumes:
      - bot-data:/app/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
